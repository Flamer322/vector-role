---
- name: Install Vector on Debian-based systems
  ansible.builtin.apt:
    deb: "{{ vector_deb_url }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install Vector on RedHat-based systems
  ansible.builtin.dnf:
    name: "{{ vector_rpm_url }}"
    state: present
    disable_gpg_check: true
  when: ansible_os_family == "RedHat"

- name: Configure Vector
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: root
    group: vector
    mode: "0640"
  notify: Restart Vector

- name: Ensure Vector service is running
  ansible.builtin.service:
    name: "{{ vector_service_name }}"
    state: "{{ vector_service_state }}"
    enabled: "{{ vector_service_enabled }}"
  when: vector_service_manage | bool
