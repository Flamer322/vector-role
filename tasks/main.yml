---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Download Vector distribution
  ansible.builtin.get_url:
    url: "{{ vector_deb_url }}"
    dest: "/tmp/vector_{{ vector_version }}.deb"
    mode: "0644"

- name: Install Vector
  ansible.builtin.apt:
    deb: "/tmp/vector_{{ vector_version }}.deb"
    state: present
  notify: Restart Vector

- name: Configure Vector
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: "{{ vector_config_path }}"
    owner: root
    group: vector
    mode: "0640"
  notify: Restart Vector

- name: Ensure Vector service is running
  ansible.builtin.service:
    name: "{{ vector_service_name }}"
    state: "{{ vector_service_state }}"
    enabled: "{{ vector_service_enabled }}"
